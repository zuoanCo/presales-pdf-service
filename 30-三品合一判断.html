<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30 · 亲密陪伴机器人三品合一判断</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0b0b0b; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden;
         font-family: "Microsoft YaHei", "微软雅黑", sans-serif; }
  .stage { position: relative; width: 1280px; height: 720px; flex: none; overflow: hidden; background: #FFFFFF; }
  .stage > * { position: absolute; }

  .title-bar { left: 44.7px; top: 31.7px; width: 6.7px; height: 77.8px; background: #FFFF00; }
  .page-title { left: 53.8px; top: 22px; width: 306px; padding: 0 9.6px;
                font-size: 37.3px; line-height: 1.3; color: #143668; }

  .node { background: #00B0F0; border-radius: 50%; color: #FFFFFF;
          font-size: 48px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .n-cat { left: 621.1px; top: 132.5px; width: 119px; height: 119px; }
  .n-prod { left: 259.2px; top: 496.3px; width: 179.5px; height: 179.5px; }
  .n-brand { left: 808.3px; top: 504px; width: 179.5px; height: 179.5px; }

  .dot { width: 28.8px; height: 28.8px; background: #00B0F0; border-radius: 50%; }
  .dot-l { left: 263px; top: 360px; }
  .dot-r { left: 980.2px; top: 360px; }

  .head { left: 551px; top: 307.2px; width: 145.9px; height: 196.8px; }
  .origin { left: 602.9px; top: 323.5px; width: 63.4px; height: 73.9px; background: #ED7D31;
            color: #FFFFFF; font-size: 26.7px; font-weight: 700; line-height: 1.2;
            display: flex; align-items: center; justify-content: center; text-align: center; }

  .lbl-center { left: 579.8px; top: 232.3px; font-size: 24px; font-weight: 700; color: #000;
                font-family: "DengXian", "等线", "Microsoft YaHei", sans-serif; }
  .lbl-side { font-size: 18.7px; color: #000; line-height: 2.05;
              font-family: "DengXian", "等线", "Microsoft YaHei", sans-serif; }
  .lbl-left { left: 350.4px; top: 337px; }
  .lbl-right { left: 831.4px; top: 336px; }

  .lbl-rot { font-size: 21.3px; font-weight: 700; color: #000; white-space: nowrap;
             font-family: "DengXian", "等线", "Microsoft YaHei", sans-serif; }
  .rot-carrier { left: 451.2px; top: 471.4px; transform: rotate(-39.59deg); }
  .rot-mind { left: 693.1px; top: 476.2px; transform: rotate(36.96deg); }

  .anno { font-size: 16px; line-height: 1.32; color: #333942; }
  .anno .t { font-size: 21.3px; font-weight: 700; }
  .anno b { font-weight: 700; }
  .anno-plan { left: 718px; top: 30.7px; width: 360px; }
  .anno-user { left: 33.6px; top: 275.5px; width: 333px; }
  .anno-visual { left: 938.9px; top: 269.8px; width: 230.4px; }
  .anno-carrier { left: 49.9px; top: 510.7px; width: 210.2px; }
  .anno-mind { left: 1006.1px; top: 531.8px; width: 202.6px; }
  .export-btn { position: fixed; right: 24px; bottom: 24px; z-index: 10; padding: 10px 22px;
                font-size: 15px; font-family: inherit; color: #FFFFFF; background: #1F4E79;
                border: none; border-radius: 6px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .export-btn:hover { background: #2A63A0; }

  .stage { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @page { size: 13.333in 7.5in; margin: 0; }
  @media print {
    html, body { width: 1280px; height: 720px; background: #FFFFFF; overflow: visible; }
    body { display: block; }
    .stage { transform: none !important; }
    .export-btn { display: none; }
  }
</style>
</head>
<body>
<!-- ============ 可修改的页面参数 ============ -->
<script>
const PARAMS = {
  // 页面标题
  title: '参数内容（页面标题）',
  // 价值方案
  plan: {
    name: '参数内容（品类名称）',
    solution: '参数内容（解决方案）'
  },
  // 用户原点：核心用户 / 真实场景 / 核心需求 / 关键痛点
  user: [
    '参数内容（核心用户）',
    '参数内容（真实场景）',
    '参数内容（核心需求）',
    '参数内容（关键痛点）'
  ],
  // 品牌：视觉锤 / 语言钉
  visual: {
    hammer: '参数内容（视觉锤）',
    nail: '参数内容（语言钉）'
  },
  // 价值载体：重点 / 判断
  carrier: {
    focus: '参数内容（价值载体重点）',
    judge: '参数内容（价值载体判断）'
  },
  // 价值心智：重点 / 避免 / 判断
  mind: {
    focus: '参数内容（价值心智重点）',
    avoid: '参数内容（价值心智避免）',
    judge: '参数内容（价值心智判断）'
  }
};
</script>
<!-- ================================================================== -->

<div class="stage" id="stage">
  <svg width="1280" height="720" viewBox="0 0 1280 720" style="left:0;top:0;">
    <defs>
      <marker id="arB" markerWidth="9" markerHeight="9" refX="6" refY="3.5" orient="auto-start-reverse">
        <path d="M0,0 L8,3.5 L0,7 Z" fill="#5B9BD5"/>
      </marker>
      <marker id="arC" markerWidth="9" markerHeight="9" refX="6" refY="3.5" orient="auto-start-reverse">
        <path d="M0,0 L8,3.5 L0,7 Z" fill="#40A3E7"/>
      </marker>
    </defs>
    <!-- inner triangle -->
    <polygon points="627.3,109.4 368.6,554.8 886,554.8" fill="none" stroke="#4472C4" stroke-width="6"/>
    <!-- outer circle -->
    <circle cx="629.3" cy="387.4" r="290.4" fill="none" stroke="#40A3E7" stroke-width="8"/>
    <!-- arrowheads on outer circle -->
    <polygon points="739.2,96 709.9,146.9 768.5,146.9" fill="#00B0F0" transform="rotate(303.12 739.2 121.45)"/>
    <polygon points="511.2,94.1 481.9,145 540.5,145" fill="#00B0F0" transform="rotate(294.86 511.2 119.55)"/>
    <polygon points="775.2,598.1 745.9,649 804.5,649" fill="#00B0F0" transform="rotate(302.28 775.2 623.55)"/>
    <polygon points="453.6,593.3 424.3,644.2 482.9,644.2" fill="#00B0F0" transform="rotate(302.28 453.6 618.75)"/>
    <!-- dashed vertical double-arrow below 品类 -->
    <line x1="631.7" y1="197.8" x2="631.7" y2="306.2" stroke="#40A3E7" stroke-width="2"
          stroke-dasharray="5 4" marker-start="url(#arC)" marker-end="url(#arC)"/>
    <line x1="679.7" y1="253.4" x2="679.7" y2="325.4" stroke="#40A3E7" stroke-width="2"
          stroke-dasharray="5 4" marker-end="url(#arC)"/>
    <!-- horizontal arrows toward the head -->
    <line x1="264" y1="373.4" x2="535" y2="373.4" stroke="#5B9BD5" stroke-width="1.5" marker-end="url(#arB)"/>
    <line x1="706.6" y1="373.4" x2="995.5" y2="373.4" stroke="#5B9BD5" stroke-width="1.5" marker-start="url(#arB)"/>
    <!-- dashed diagonals toward the head -->
    <line x1="428.2" y1="517.4" x2="547.2" y2="432" stroke="#5B9BD5" stroke-width="2"
          stroke-dasharray="5 4" marker-end="url(#arB)"/>
    <line x1="817.9" y1="517.4" x2="698" y2="432" stroke="#5B9BD5" stroke-width="2"
          stroke-dasharray="5 4" marker-end="url(#arB)"/>
  </svg>

  <div class="title-bar"></div>
  <div class="page-title" id="pageTitle"></div>

  <div class="node n-cat">品类</div>
  <div class="node n-prod">产品</div>
  <div class="node n-brand">品牌</div>

  <div class="dot dot-l"></div>
  <div class="dot dot-r"></div>

  <img class="head" src="assets/head.png" alt="">
  <div class="origin">原点<br>用户</div>

  <div class="lbl-center">价值方案</div>
  <div class="lbl-side lbl-left">真用户<br>真场景</div>
  <div class="lbl-side lbl-right">视觉锤<br>语言钉</div>
  <div class="lbl-rot rot-carrier">价值载体</div>
  <div class="lbl-rot rot-mind">价值心智</div>

  <div class="anno anno-plan">
    <div class="t">价值方案</div>
    <div><b>品类名称</b>：<span id="planName"></span></div>
    <div><b>解决方案</b>：<span id="planSolution"></span></div>
  </div>
  <div class="anno anno-user">
    <div><b>核心用户</b>：<span class="uval"></span></div>
    <div><b>真实场景</b>：<span class="uval"></span></div>
    <div><b>核心需求</b>：<span class="uval"></span></div>
    <div><b>关键痛点</b>：<span class="uval"></span></div>
  </div>
  <div class="anno anno-visual">
    <div><b>视觉锤</b>：<span id="visualHammer"></span></div>
    <div><b>语言钉</b>：<span id="visualNail"></span></div>
  </div>
  <div class="anno anno-carrier">
    <div class="t">价值载体</div>
    <div><b>重点</b>：<span id="carrierFocus"></span></div>
    <div><b>判断</b>：<span id="carrierJudge"></span></div>
  </div>
  <div class="anno anno-mind">
    <div class="t">价值心智</div>
    <div><b>重点</b>：<span id="mindFocus"></span></div>
    <div><b>避免</b>：<span id="mindAvoid"></span></div>
    <div><b>判断</b>：<span id="mindJudge"></span></div>
  </div>
</div>
<script>
  // 参数注入
  function setText(id, v) { document.getElementById(id).textContent = v; }
  setText('pageTitle', PARAMS.title);
  setText('planName', PARAMS.plan.name);
  setText('planSolution', PARAMS.plan.solution);
  document.querySelectorAll('.anno-user .uval').forEach(function (el, i) {
    el.textContent = PARAMS.user[i];
  });
  setText('visualHammer', PARAMS.visual.hammer);
  setText('visualNail', PARAMS.visual.nail);
  setText('carrierFocus', PARAMS.carrier.focus);
  setText('carrierJudge', PARAMS.carrier.judge);
  setText('mindFocus', PARAMS.mind.focus);
  setText('mindAvoid', PARAMS.mind.avoid);
  setText('mindJudge', PARAMS.mind.judge);

  function fit() {
    var s = Math.min(innerWidth / 1280, innerHeight / 720);
    document.getElementById('stage').style.transform = 'scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();

  var btn = document.createElement('button');
  btn.className = 'export-btn';
  btn.textContent = '导出 PDF';
  btn.onclick = function () { window.print(); };
  document.body.appendChild(btn);
</script>
</body>
</html>
